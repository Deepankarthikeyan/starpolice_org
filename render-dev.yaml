# Render Blueprint — DEV API (repo root copy for Render discovery)
# Dashboard → Blueprint → repo Deepankarthikeyan/starpolice_org → branch main
services:
  - type: web
    name: starpolice-api-dev
    runtime: docker
    rootDir: starpolice_panel-master/server
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    branch: main
    envVars:
      - key: CLIENT_URL
        value: https://starpoliceacademy-dev.netlify.app
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: "Star Police Academy <info@starpoliceacademy.in>"
