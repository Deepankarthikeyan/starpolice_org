[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

# Proxy panel API requests to the deployed backend before SPA rewrites.
[[redirects]]
  from = "/api/*"
  to = "https://starpolice-api.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "https://starpolice-api.onrender.com/uploads/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/admin"
  to = "/panel/index.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/panel/index.html"
  status = 200

[[redirects]]
  from = "/staff"
  to = "/panel/index.html"
  status = 200

[[redirects]]
  from = "/staff/*"
  to = "/panel/index.html"
  status = 200

[[redirects]]
  from = "/student"
  to = "/panel/index.html"
  status = 200

[[redirects]]
  from = "/student/*"
  to = "/panel/index.html"
  status = 200
