[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/admin"
  to = "/panel/index.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/panel/index.html"
  status = 200

[[redirects]]
  from = "/staff"
  to = "/panel/index.html"
  status = 200

[[redirects]]
  from = "/staff/*"
  to = "/panel/index.html"
  status = 200

[[redirects]]
  from = "/student"
  to = "/panel/index.html"
  status = 200

[[redirects]]
  from = "/student/*"
  to = "/panel/index.html"
  status = 200
